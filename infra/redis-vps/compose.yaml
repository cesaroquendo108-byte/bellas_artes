name: bellas-artes

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    cap_drop: []
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 100
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - internal

  gateway:
    <<: *service-defaults
    image: ${BELLAS_ARTES_IMAGE:?BELLAS_ARTES_IMAGE es obligatorio}
    command: ["./node_modules/.bin/tsx", "gateway/redis-gateway.ts"]
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --conditions=react-server
      REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}@redis:6379
      BULLMQ_PREFIX: bellas-artes
      QUEUE_GATEWAY_PORT: "8787"
    env_file:
      - /etc/bellas-artes/gateway.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "gateway:health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 150
    ports:
      - "172.17.0.1:8787:8787"
    networks:
      - internal

  worker:
    <<: *service-defaults
    image: ${BELLAS_ARTES_IMAGE:?BELLAS_ARTES_IMAGE es obligatorio}
    command: ["./node_modules/.bin/tsx", "workers/generation-worker.ts"]
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --conditions=react-server
      REDIS_URL: redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}@redis:6379
      BULLMQ_PREFIX: bellas-artes
      RUN_GENERATION_WORKER: "true"
    env_file:
      - /etc/bellas-artes/worker.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "./node_modules/.bin/tsx", "scripts/worker-healthcheck.ts"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.50
    pids_limit: 300
    networks:
      - internal

volumes:
  redis-data:

networks:
  internal: {}
